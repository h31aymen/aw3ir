<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>TP2</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Place favicon.ico in the root directory -->

    <style>
      body {
        background-color: #e9ebee;
        font-family: system, -apple-system, ".SFNSText-Regular", "San Francisco",
          "Roboto", "Segoe UI", "Helvetica Neue", "Lucida Grande", sans-serif;
        font-size: 16px;
        margin: 0 auto;
        max-width: 800px;
      }
    </style>

    <!-- Code à dé-commenter si besoin de fichier CSS ou JS -->
    <link rel="stylesheet" href="style.css">
    <!--<script src="js/main.js"></script>-->
  </head>
  <body>
    <h1>tp2</h1>
    <form action="action.html" method="get">
      <label for="name">Nom</label>
      <input type="text" name="name" minlength="2" maxlength="20" required id="name"><span class="icon-ok">✔</span>
      <br>
      <label for="firstname">Prenom</label>
      <input type="text" name="firstname" minlength="2" maxlength="20" required id="firstname"><span class="icon-ok">✔</span>
      <br>
      <label for="birthday">Date de naissance</label>
      <input type="date" name="birthday" required id="birthday"><span class="icon-ok">✔</span>
      <br>
      <label for="address">Adresse</label>
      <input type="text" name="address" minlength="5" maxlength="50" required id="address"><span class="icon-ok">✔</span>
      <br>
      <label for="email">Email</label>
      <input type="email" name="email" minlength="5" maxlength="30" required id="email"><span class="icon-ok">✔</span>
      <br>
      <input type="submit" name="submit" class="btn-primary">
    </form>
    <p>Hello world! This is HTML5 Boilerplate.</p>
    <img src="../galilee.png" alt="Logo Galilee" />
  </body>
</html>
